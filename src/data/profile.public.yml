pr: '現場で働く人の苦労から出発します。技術を前面に出すのではなく、入力の動線を変えずに裏側でデータを整え、判断を支える設計を選びます。

  方向を揃えてから渡します。判断の前提と採用しなかった選択肢を明示し、決定は立場のある人が行える形に整えます。解いた後は、受け取るチームが自走できる状態にして手を離し、使われ続ける姿まで見届けます。

  新しい技術を獲得し、組み合わせ続けます。物理デバイスから生成AIまで、自分の手で試して確かめることを、設計判断の確かさの源にしています。'
