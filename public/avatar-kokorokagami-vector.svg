<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>

    <!-- Mirror Halo Ring Gradient -->
    <linearGradient id="mirrorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glass Reflection Gradient -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Spectacle Lens Coating Glow -->
    <linearGradient id="lensCoatingLeft" x1="20%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.20" />
      <stop offset="75%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="lensCoatingRight" x1="10%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.20" />
      <stop offset="75%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
    </linearGradient>

    <!-- Skin Tones -->
    <linearGradient id="skinGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f8d7bd" />
      <stop offset="60%" stop-color="#f2be9b" />
      <stop offset="100%" stop-color="#e2a780" />
    </linearGradient>

    <linearGradient id="neckShadow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#d4946b" />
      <stop offset="100%" stop-color="#be7952" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3142" />
      <stop offset="30%" stop-color="#1f2330" />
      <stop offset="100%" stop-color="#12131a" />
    </linearGradient>

    <linearGradient id="hairHighlight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#4b5563" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1f2330" stop-opacity="0" />
    </linearGradient>

    <!-- Gingham Pattern for Shirt -->
    <pattern id="ginghamPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <!-- White base -->
      <rect width="16" height="16" fill="#f8fafc" />
      <!-- Horizontal navy stripe -->
      <rect y="0" width="16" height="8" fill="#475569" fill-opacity="0.32" />
      <!-- Vertical navy stripe -->
      <rect x="0" width="8" height="16" fill="#475569" fill-opacity="0.32" />
      <!-- Crossing intersection darker -->
      <rect x="0" y="0" width="8" height="8" fill="#1e293b" fill-opacity="0.45" />
    </pattern>

    <!-- Shirt Base Fabric -->
    <linearGradient id="shirtShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="mirrorAura" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Circular Avatar Clip -->
    <clipPath id="avatarCircle">
      <circle cx="512" cy="512" r="500" />
    </clipPath>
  </defs>

  <!-- Base Canvas / Circular boundary -->
  <g clip-path="url(#avatarCircle)">
    <!-- 1. Background -->
    <rect width="1024" height="1024" fill="url(#bgGlow)" />

    <!-- 2. Kokoro Kagami Sacred Geometry / Mirror Halo -->
    <!-- Ambient outer tech ring -->
    <circle cx="512" cy="512" r="460" fill="none" stroke="url(#mirrorGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.4" />
    
    <!-- Concentric mirror rings -->
    <circle cx="512" cy="512" r="435" fill="none" stroke="url(#mirrorGrad)" stroke-width="3" filter="url(#mirrorAura)" opacity="0.65" />
    <circle cx="512" cy="512" r="410" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />

    <!-- Octagonal mirror facets (reflecting 8 cardinal directions of thought) -->
    <polygon points="
      512,90 795,195 900,478 795,761 512,866 229,761 124,478 229,195
    " fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="16 12" opacity="0.35" />

    <!-- Diagonal Glass Sheen across the mirror background -->
    <polygon points="120,0 360,0 904,1024 664,1024" fill="url(#glassSheen)" opacity="0.4" />

    <!-- Subtle digital coordinate crosshairs -->
    <line x1="512" y1="35" x2="512" y2="70" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
    <line x1="512" y1="954" x2="512" y2="989" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
    <line x1="35" y1="512" x2="70" y2="512" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
    <line x1="954" y1="512" x2="989" stroke="#38bdf8" stroke-width="2" opacity="0.7" />

    <!-- 3. Character Body: Shirt & Shoulders -->
    <g id="character">
      <!-- Shoulders & Torso -->
      <path d="M180,1024 C190,890 270,760 410,740 L614,740 C754,760 834,890 844,1024 Z" 
            fill="url(#ginghamPattern)" />
      <path d="M180,1024 C190,890 270,760 410,740 L614,740 C754,760 834,890 844,1024 Z" 
            fill="url(#shirtShade)" />

      <!-- Chest opening / Under-collar skin -->
      <polygon points="460,740 564,740 528,845 496,845" fill="url(#neckShadow)" />
      <polygon points="475,760 549,760 522,835 502,835" fill="url(#skinGrad)" />

      <!-- Left Collar -->
      <polygon points="420,735 512,825 460,845 385,765" fill="#f8fafc" />
      <polygon points="420,735 512,825 460,845 385,765" fill="url(#ginghamPattern)" />
      <polygon points="420,735 512,825 460,845 385,765" fill="#000000" fill-opacity="0.12" />
      <path d="M420,735 L512,825 L460,845 L385,765 Z" fill="none" stroke="#64748b" stroke-width="2" />

      <!-- Right Collar -->
      <polygon points="604,735 512,825 564,845 639,765" fill="#f8fafc" />
      <polygon points="604,735 512,825 564,845 639,765" fill="url(#ginghamPattern)" />
      <polygon points="604,735 512,825 564,845 639,765" fill="#000000" fill-opacity="0.05" />
      <path d="M604,735 L512,825 L564,845 L639,765 Z" fill="none" stroke="#64748b" stroke-width="2" />

      <!-- Collar button detail -->
      <circle cx="512" cy="880" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />

      <!-- Neck -->
      <path d="M440,600 L440,750 C475,780 549,780 584,750 L584,600 Z" fill="url(#skinGrad)" />
      <!-- Neck Shadow under chin -->
      <path d="M440,600 C480,680 544,680 584,600 C584,660 560,710 512,710 C464,710 440,660 440,600 Z" fill="url(#neckShadow)" />
      <path d="M495,680 L529,680 L512,715 Z" fill="#b96d44" opacity="0.3" /> <!-- Adam's apple subtle cue -->

      <!-- Ears -->
      <!-- Left Ear -->
      <g id="leftEar">
        <ellipse cx="340" cy="485" rx="30" ry="50" fill="url(#skinGrad)" transform="rotate(-5, 340, 485)" />
        <path d="M342,455 C330,470 330,495 344,515" fill="none" stroke="#c88358" stroke-width="4" stroke-linecap="round" />
        <path d="M346,470 C340,480 340,490 348,495" fill="none" stroke="#be7952" stroke-width="3" stroke-linecap="round" />
      </g>
      <!-- Right Ear -->
      <g id="rightEar">
        <ellipse cx="684" cy="485" rx="30" ry="50" fill="url(#skinGrad)" transform="rotate(5, 684, 485)" />
        <path d="M682,455 C694,470 694,495 680,515" fill="none" stroke="#c88358" stroke-width="4" stroke-linecap="round" />
        <path d="M678,470 C684,480 684,490 676,495" fill="none" stroke="#be7952" stroke-width="3" stroke-linecap="round" />
      </g>

      <!-- Head Base & Jaw -->
      <path d="M352,430 
               C345,560 405,670 512,670 
               C619,670 679,560 672,430 
               C672,310 610,240 512,240 
               C414,240 352,310 352,430 Z" 
            fill="url(#skinGrad)" />

      <!-- Cheeks & Jaw subtle warmth -->
      <ellipse cx="405" cy="530" rx="45" ry="25" fill="#f43f5e" opacity="0.08" />
      <ellipse cx="619" cy="530" rx="45" ry="25" fill="#f43f5e" opacity="0.08" />

      <!-- Hair: Base & Volume (Black / Dark Slate with modern neat cut) -->
      <path d="M348,420 
               C335,350 360,260 410,215 
               C455,175 570,175 625,220 
               C670,255 690,340 676,420 
               C672,390 660,335 635,310 
               C615,290 580,285 540,295 
               C490,305 440,300 395,335 
               C370,355 355,385 348,420 Z" 
            fill="url(#hairGrad)" />

      <!-- Hair Strands & Natural Bangs (Short, slightly parted at left-center) -->
      <path d="M358,375 C380,315 440,295 490,295 C450,310 415,340 400,370 Z" fill="#2d3142" />
      <path d="M475,285 C510,280 560,285 615,315 C580,315 545,320 520,335 C495,350 480,370 475,395 C470,360 472,320 475,285 Z" fill="#1f2330" />
      <path d="M610,285 C640,310 665,350 670,395 C665,360 645,330 625,315 Z" fill="#2d3142" />

      <!-- Hair Sideburns -->
      <polygon points="348,410 360,455 349,462 344,425" fill="#1b1c24" />
      <polygon points="676,410 664,455 675,462 680,425" fill="#1b1c24" />

      <!-- Hair Top Highlight Arc -->
      <path d="M425,215 C480,195 545,195 600,218 C585,210 540,202 485,205 C450,207 435,212 425,215 Z" fill="url(#hairHighlight)" />

      <!-- Eyebrows (Gentle, masculine, intellectual) -->
      <!-- Left Eyebrow -->
      <path d="M400,410 C425,400 455,402 478,415" fill="none" stroke="#252836" stroke-width="7.5" stroke-linecap="round" />
      <!-- Right Eyebrow -->
      <path d="M546,415 C569,402 599,400 624,410" fill="none" stroke="#252836" stroke-width="7.5" stroke-linecap="round" />

      <!-- Eyes (Calm, observant, thoughtful) -->
      <!-- Left Eye -->
      <g id="leftEye">
        <path d="M408,445 C425,436 450,436 468,446" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" /> <!-- Eyelid fold -->
        <path d="M406,456 C422,444 452,444 470,456 C454,467 422,467 406,456 Z" fill="#ffffff" />
        <!-- Iris -->
        <circle cx="438" cy="455" r="11" fill="#1e293b" />
        <circle cx="438" cy="455" r="9.5" fill="#334155" />
        <circle cx="438" cy="455" r="5" fill="#0f172a" />
        <!-- Catchlight -->
        <circle cx="435" cy="452" r="3" fill="#ffffff" />
        <circle cx="441" cy="457" r="1.5" fill="#93c5fd" />
        <!-- Eye outline -->
        <path d="M405,455 C422,443 452,443 471,455" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" />
        <path d="M410,457 C425,466 450,466 466,457" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
      </g>

      <!-- Right Eye -->
      <g id="rightEye">
        <path d="M556,446 C574,436 599,436 616,445" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" /> <!-- Eyelid fold -->
        <path d="M554,456 C572,444 602,444 618,456 C602,467 572,467 554,456 Z" fill="#ffffff" />
        <!-- Iris -->
        <circle cx="586" cy="455" r="11" fill="#1e293b" />
        <circle cx="586" cy="455" r="9.5" fill="#334155" />
        <circle cx="586" cy="455" r="5" fill="#0f172a" />
        <!-- Catchlight -->
        <circle cx="583" cy="452" r="3" fill="#ffffff" />
        <circle cx="589" cy="457" r="1.5" fill="#93c5fd" />
        <!-- Eye outline -->
        <path d="M553,455 C572,443 602,443 619,455" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" />
        <path d="M558,457 C574,466 599,466 614,457" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
      </g>

      <!-- Nose (Defined bridge, gentle natural shape) -->
      <path d="M510,435 L508,510 C503,516 496,524 502,528 C508,531 516,531 522,528 C528,524 521,516 516,510 L514,435" 
            fill="none" stroke="#c88358" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <ellipse cx="512" cy="522" rx="9" ry="4" fill="#b96d44" opacity="0.35" />
      <!-- Nostrils subtle cues -->
      <circle cx="498" cy="524" r="2.5" fill="#9c562e" opacity="0.6" />
      <circle cx="526" cy="524" r="2.5" fill="#9c562e" opacity="0.6" />

      <!-- Mouth (Gentle, reserved, intelligent smile) -->
      <path d="M465,580 C488,590 536,590 559,580" fill="none" stroke="#93462f" stroke-width="4.5" stroke-linecap="round" />
      <!-- Upper lip subtle line -->
      <path d="M485,578 C500,574 524,574 539,578" fill="none" stroke="#b25a3d" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
      <!-- Smile corners -->
      <path d="M462,578 C465,580 467,583 469,584" fill="none" stroke="#7e321e" stroke-width="3" stroke-linecap="round" />
      <path d="M562,578 C559,580 557,583 555,584" fill="none" stroke="#7e321e" stroke-width="3" stroke-linecap="round" />
      <!-- Lower lip shadow & definition -->
      <path d="M488,602 C502,608 522,608 536,602" fill="none" stroke="#a45339" stroke-width="3.5" stroke-linecap="round" opacity="0.7" />

      <!-- 4. Spectacles / Glasses (Key Persona Element: Sleek Rectangular/Oval Metal Frame) -->
      <g id="spectacles">
        <!-- Frame Drop Shadows -->
        <rect x="376" y="426" width="112" height="66" rx="18" fill="none" stroke="#000000" stroke-width="6" opacity="0.25" />
        <rect x="536" y="426" width="112" height="66" rx="18" fill="none" stroke="#000000" stroke-width="6" opacity="0.25" />

        <!-- Lens Glass Fills with Antireflective Blue Sheen (Photos show characteristic blue reflections!) -->
        <rect x="374" y="424" width="112" height="66" rx="18" fill="url(#lensCoatingLeft)" />
        <rect x="538" y="424" width="112" height="66" rx="18" fill="url(#lensCoatingRight)" />

        <!-- Lens Sheen Diagonal Reflection Bars -->
        <path d="M382,475 L430,430 L445,430 L397,475 Z" fill="#ffffff" opacity="0.35" />
        <path d="M546,475 L594,430 L609,430 L561,475 Z" fill="#ffffff" opacity="0.35" />

        <!-- Metal Rims: Bronze / Gunmetal sleek metallic frame -->
        <!-- Left Rim -->
        <rect x="374" y="424" width="112" height="66" rx="18" 
              fill="none" stroke="#5a4238" stroke-width="4.5" />
        <!-- Top Brow Rim Accent (slightly thicker on top) -->
        <path d="M374,450 C374,432 388,424 406,424 L454,424 C472,424 486,432 486,450" 
              fill="none" stroke="#78594b" stroke-width="5.5" stroke-linecap="round" />

        <!-- Right Rim -->
        <rect x="538" y="424" width="112" height="66" rx="18" 
              fill="none" stroke="#5a4238" stroke-width="4.5" />
        <!-- Top Brow Rim Accent -->
        <path d="M538,450 C538,432 552,424 570,424 L618,424 C636,424 650,432 650,450" 
              fill="none" stroke="#78594b" stroke-width="5.5" stroke-linecap="round" />

        <!-- Bridge -->
        <path d="M486,442 C496,436 528,436 538,442" fill="none" stroke="#78594b" stroke-width="5" stroke-linecap="round" />
        <path d="M492,447 C502,442 522,442 532,447" fill="none" stroke="#5a4238" stroke-width="3" stroke-linecap="round" />

        <!-- Nose Pads -->
        <path d="M482,458 C484,468 478,476 476,480" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
        <path d="M542,458 C540,468 546,476 548,480" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

        <!-- Temple Hinges extending to ears -->
        <path d="M374,440 L342,452" fill="none" stroke="#78594b" stroke-width="4.5" stroke-linecap="round" />
        <path d="M650,440 L682,452" fill="none" stroke="#78594b" stroke-width="4.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- 5. "kokorokagami" Symbolic Brand Element (Bottom Curved Subtle Badge / Sigil) -->
    <g id="sigil" opacity="0.9">
      <!-- Minimalist Central Mirror Diamond Emblem -->
      <polygon points="512,940 522,952 512,964 502,952" fill="#38bdf8" />
      <polygon points="512,935 526,952 512,969 498,952" fill="none" stroke="#818cf8" stroke-width="1.5" />
      
      <!-- Text label along bottom edge -->
      <text x="512" y="990" 
            text-anchor="middle" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
            font-size="20" 
            font-weight="600" 
            letter-spacing="7" 
            fill="#94a3b8">KOKOROKAGAMI</text>
    </g>

    <!-- Outer Circular Framing Ring -->
    <circle cx="512" cy="512" r="498" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8" />
    <circle cx="512" cy="512" r="492" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.4" />
  </g>
</svg>